# Sub0Platform tests on Windows and Linux: the Python package against the shared conformance vectors, with real
# processes, files and locks. The C++ library joins when it lands (cpp/README.md).
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s python/tests -v
